<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradPola" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="stallRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="stallOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="shadowPola" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25" />
    </filter>
    <filter id="glowPola" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGradPola)" rx="32" />

  <!-- Title Badge Top Left -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="370" height="60" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="2" opacity="0.95" />
    <text x="20" y="25" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="extrabold" letter-spacing="1.5">PENGENALAN POLA DALAM HIDUP MURID</text>
    <text x="20" y="47" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">Pola Antrean Kantin Sekolah</text>
  </g>

  <!-- Isometric Canteen Base (Center ~ 400, 450) -->
  <g transform="translate(400, 450)" filter="url(#shadowPola)">
    
    <!-- Floor Tile (Canteen Floor) -->
    <path d="M 0 -170 L 330 0 L 0 170 L -330 0 Z" fill="#1e293b" stroke="#334155" stroke-width="3" />
    
    <!-- Chequered Canteen Floor Pattern Lines -->
    <path d="M -165 -85 L 165 85" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 -170 L 0 170" stroke="#334155" stroke-width="1.5" />
    <path d="M -165 85 L 165 -85" stroke="#334155" stroke-width="1.5" />

    <!-- ============================================== -->
    <!-- STAN 1: KANTIN BAKSO & MIE (KIRI)              -->
    <!-- ============================================== -->
    <g transform="translate(-160, -70)">
      <!-- Counter Body -->
      <polygon points="-50,-10 30,-50 90,-20 10,20" fill="#047857" />
      <polygon points="-50,-10 10,20 10,60 -50,30" fill="#065f46" />
      <polygon points="10,20 90,-20 90,20 10,60" fill="#022c22" />
      <!-- Roof Canopy -->
      <polygon points="-65,-70 20,-115 110,-75 25,-30" fill="url(#stallRoof)" />
      <polygon points="-65,-70 25,-30 25,-20 -65,-60" fill="#047857" />
      <!-- Signboard -->
      <rect x="-15" y="-55" width="70" height="20" rx="5" fill="#f8fafc" stroke="#10b981" stroke-width="1.5" transform="skewY(-15)" />
      <text x="20" y="-41" fill="#047857" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" transform="skewY(-15)">BAKSO &amp; MIE</text>
      <!-- Bowls on counter -->
      <ellipse cx="25" cy="5" rx="8" ry="4" fill="#ffffff" />
      <ellipse cx="50" cy="-10" rx="8" ry="4" fill="#ffffff" />
    </g>

    <!-- ============================================== -->
    <!-- STAN 2: KANTIN ES TEH & MINUMAN (KANAN)        -->
    <!-- ============================================== -->
    <g transform="translate(90, -110)">
      <!-- Counter Body -->
      <polygon points="-40,-15 40,-55 100,-25 20,15" fill="#d97706" />
      <polygon points="-40,-15 20,15 20,55 -40,25" fill="#b45309" />
      <polygon points="20,15 100,-25 100,15 20,55" fill="#78350f" />
      <!-- Roof Canopy -->
      <polygon points="-55,-75 30,-120 115,-80 30,-35" fill="url(#stallOrange)" />
      <!-- Signboard -->
      <rect x="-10" y="-60" width="75" height="20" rx="5" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.5" transform="skewY(-15)" />
      <text x="25" y="-46" fill="#b45309" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" transform="skewY(-15)">ANEKA ES TEH</text>
      <!-- Drink cups -->
      <rect x="35" y="-15" width="7" height="12" rx="2" fill="#06b6d4" />
      <rect x="50" y="-22" width="7" height="12" rx="2" fill="#06b6d4" />
    </g>

    <!-- ============================================== -->
    <!-- SISWA-SISWI MENGANTRE (SERAGAM PUTIH ABU-ABU)  -->
    <!-- ============================================== -->
    <!-- Siswa 1 (Paling Depan) -->
    <g transform="translate(-60, 40)">
      <ellipse cx="0" cy="30" rx="14" ry="5" fill="#000000" opacity="0.3" />
      <!-- Legs (Abu-abu) -->
      <rect x="-6" y="10" width="5" height="20" fill="#64748b" />
      <rect x="1" y="10" width="5" height="20" fill="#64748b" />
      <!-- Body (Kemeja Putih) -->
      <rect x="-8" y="-12" width="16" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <polygon points="-4,-12 0,-3 4,-12" fill="#3b82f6" />
      <!-- Head -->
      <circle cx="0" cy="-20" r="9" fill="#fed7aa" />
      <!-- Hair -->
      <path d="M -9 -23 Q 0 -30 9 -23 Q 6 -32 -9 -23" fill="#1e293b" />
    </g>

    <!-- Siswa 2 (Antrean Kedua) -->
    <g transform="translate(-10, 70)">
      <ellipse cx="0" cy="30" rx="14" ry="5" fill="#000000" opacity="0.3" />
      <rect x="-6" y="10" width="5" height="20" fill="#64748b" />
      <rect x="1" y="10" width="5" height="20" fill="#64748b" />
      <rect x="-8" y="-12" width="16" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="0" cy="-20" r="9" fill="#fed7aa" />
      <path d="M -9 -23 Q 0 -30 9 -23 Q 6 -32 -9 -23" fill="#334155" />
    </g>

    <!-- Siswa 3 (Antrean Ketiga) -->
    <g transform="translate(40, 100)">
      <ellipse cx="0" cy="30" rx="14" ry="5" fill="#000000" opacity="0.3" />
      <rect x="-6" y="10" width="5" height="20" fill="#64748b" />
      <rect x="1" y="10" width="5" height="20" fill="#64748b" />
      <rect x="-8" y="-12" width="16" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="0" cy="-20" r="9" fill="#fed7aa" />
      <path d="M -9 -23 Q 0 -30 9 -23" fill="#1e293b" />
    </g>

    <!-- ============================================== -->
    <!-- GRAFIK 3D POLA JAM ISTIRAHAT (MELAYANG DI ATAS)-->
    <!-- ============================================== -->
    <g transform="translate(0, -220)">
      <!-- Hologram Backdrop Panel -->
      <polygon points="-180,-30 180,-90 180,60 -180,120" fill="#0f172a" opacity="0.88" stroke="#10b981" stroke-width="2" />
      
      <text x="-160" y="0" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" transform="skewY(-10)">POLA KEPADATAN HARIAN KANTIN</text>

      <!-- Bar 1: Jam 07.00 (Sepi) -->
      <g transform="translate(-130, 80) skewY(-10)">
        <rect x="0" y="-30" width="22" height="30" rx="3" fill="#3b82f6" />
        <text x="11" y="12" fill="#94a3b8" font-size="8" text-anchor="middle">07.00</text>
      </g>

      <!-- Bar 2: Jam 09.45 (Puncak Istirahat 1 - MELONJAK) -->
      <g transform="translate(-70, 80) skewY(-10)">
        <rect x="0" y="-95" width="26" height="95" rx="3" fill="#f43f5e" filter="url(#glowPola)" />
        <text x="13" y="-102" fill="#f43f5e" font-size="9" font-weight="bold" text-anchor="middle">RAMAI!</text>
        <text x="13" y="12" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">09.45</text>
      </g>

      <!-- Bar 3: Jam 11.00 (Sepi Pelajaran) -->
      <g transform="translate(-10, 80) skewY(-10)">
        <rect x="0" y="-25" width="22" height="25" rx="3" fill="#3b82f6" />
        <text x="11" y="12" fill="#94a3b8" font-size="8" text-anchor="middle">11.00</text>
      </g>

      <!-- Bar 4: Jam 12.15 (Puncak Tertinggi Istirahat 2) -->
      <g transform="translate(50, 80) skewY(-10)">
        <rect x="0" y="-120" width="26" height="120" rx="3" fill="#f43f5e" filter="url(#glowPola)" />
        <text x="13" y="-127" fill="#f43f5e" font-size="9" font-weight="bold" text-anchor="middle">PUNCAK!</text>
        <text x="13" y="12" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">12.15</text>
      </g>

      <!-- Bar 5: Jam 14.30 (Pulang Sekolah) -->
      <g transform="translate(110, 80) skewY(-10)">
        <rect x="0" y="-35" width="22" height="35" rx="3" fill="#3b82f6" />
        <text x="11" y="12" fill="#94a3b8" font-size="8" text-anchor="middle">14.30</text>
      </g>

      <!-- Trend Sine Wave Line -->
      <path d="M -130 65 Q -70 -40 -10 65 Q 50 -70 120 60" stroke="#facc15" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4,4" filter="url(#glowPola)" transform="skewY(-10)" />
    </g>

  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(80, 715)">
    <rect x="0" y="0" width="640" height="55" rx="16" fill="#0f172a" opacity="0.95" stroke="#047857" stroke-width="1.5" />
    <text x="25" y="24" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">
      💡 Inti Pengenalan Pola bagi Murid:
    </text>
    <text x="25" y="43" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">
      Antrean kantin selalu melonjak di jam istirahat. Kenali polanya agar kamu bisa jajan lebih cepat tanpa kehabisan!
    </text>
  </g>
</svg>
