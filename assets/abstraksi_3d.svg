<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradAbst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="routeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ojolJack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <filter id="shadowAbst" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGradAbst)" rx="32" />

  <!-- Title Badge Top Left -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="370" height="60" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" opacity="0.95" />
    <text x="20" y="25" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="extrabold" letter-spacing="1.5">ABSTRAKSI DALAM HIDUP MURID</text>
    <text x="20" y="47" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">Peta Ojek Online Pulang Sekolah</text>
  </g>

  <!-- Isometric Ground Base (Center ~ 400, 450) -->
  <g transform="translate(400, 450)" filter="url(#shadowAbst)">
    
    <!-- Floor Tile (Isometric Road Base) -->
    <path d="M 0 -170 L 330 0 L 0 170 L -330 0 Z" fill="#1e293b" stroke="#334155" stroke-width="3" />

    <!-- ============================================== -->
    <!-- SISI KIRI: REALITAS NYATA (DETAIL DIABAIKAN)   -->
    <!-- ============================================== -->
    <g transform="translate(-180, -30)" opacity="0.45">
      <!-- Pohon Mangga Rimbun (Distraksi) -->
      <polygon points="0,0 20,-10 20,40 0,50" fill="#78350f" />
      <circle cx="10" cy="-30" r="35" fill="#15803d" />
      <circle cx="-15" cy="-20" r="25" fill="#16a34a" />
      <circle cx="35" cy="-20" r="25" fill="#16a34a" />

      <!-- Kucing Menyeberang di Jalan -->
      <ellipse cx="-20" cy="50" rx="10" ry="6" fill="#f97316" />
      <circle cx="-28" cy="46" r="5" fill="#f97316" />

      <!-- Pagar Rumah Warna-Warni -->
      <line x1="50" y1="20" x2="120" y2="-15" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
      <line x1="60" y1="30" x2="60" y2="5" stroke="#ef4444" stroke-width="2" />
      <line x1="85" y1="18" x2="85" y2="-7" stroke="#3b82f6" stroke-width="2" />
      <line x1="110" y1="5" x2="110" y2="-20" stroke="#f59e0b" stroke-width="2" />

      <!-- Label "Diabaikan Abstraksi" -->
      <rect x="-60" y="80" width="180" height="24" rx="6" fill="#dc2626" opacity="0.9" />
      <text x="30" y="96" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold">
        ✕ DETAIL DIABAIKAN (POHON, KUCING)
      </text>
    </g>

    <!-- ============================================== -->
    <!-- TENGAH: SMARTPHONE 3D PETA OJOL ESENSIAL       -->
    <!-- ============================================== -->
    <g transform="translate(0, -60)">
      <!-- 3D Phone Body Base -->
      <polygon points="-80,-140 80,-220 160,-170 0,-90" fill="#0f172a" />
      <polygon points="-80,-140 0,-90 0,90 -80,40" fill="#334155" />
      <polygon points="0,-90 160,-170 160,10 0,90" fill="#1e293b" />
      
      <!-- Phone Screen Surface -->
      <polygon points="-70,-130 75,-205 145,-160 0,-85" fill="url(#phoneScreen)" stroke="#38bdf8" stroke-width="2" />

      <!-- Route Lines on Map Screen -->
      <!-- Point A: Gerbang SMA (Jemput) -->
      <circle cx="-35" cy="-125" r="7" fill="#3b82f6" filter="url(#glowGreen)" />
      <text x="-35" y="-136" text-anchor="middle" fill="#93c5fd" font-size="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold">GERBANG SMA</text>

      <!-- Glowing Clean Route Path (Abstraksi Murni) -->
      <path d="M -35 -125 L 10 -150 L 50 -130 L 100 -170" stroke="url(#routeGreen)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGreen)" />

      <!-- Motor Ojol Icon moving along route -->
      <circle cx="50" cy="-130" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="2" />

      <!-- Point B: Rumah Murid (Antar) -->
      <circle cx="100" cy="-170" r="7" fill="#ef4444" filter="url(#glowGreen)" />
      <text x="100" y="-180" text-anchor="middle" fill="#fca5a5" font-size="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold">RUMAH SISWA</text>

      <!-- ETA Badge on Screen -->
      <rect x="-10" y="-115" width="75" height="18" rx="4" fill="#15803d" opacity="0.95" />
      <text x="27" y="-103" text-anchor="middle" fill="#ffffff" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="bold">12 Menit (4.2 km)</text>
    </g>

    <!-- ============================================== -->
    <!-- SISI KANAN: MOTOR OJOL & SISWA SMA             -->
    <!-- ============================================== -->
    <g transform="translate(130, 60)">
      <!-- Motorcycle Shadow -->
      <ellipse cx="20" cy="35" rx="45" ry="15" fill="#000000" opacity="0.35" />
      
      <!-- Wheels -->
      <circle cx="-15" cy="30" r="14" fill="#0f172a" stroke="#64748b" stroke-width="4" />
      <circle cx="55" cy="30" r="14" fill="#0f172a" stroke="#64748b" stroke-width="4" />
      <!-- Chassis -->
      <polygon points="-10,25 20,10 50,15 35,30" fill="#dc2626" />

      <!-- Driver Ojol (Jaket Hijau) -->
      <ellipse cx="10" cy="0" rx="10" ry="16" fill="url(#ojolJack)" />
      <!-- Helmet Hijau -->
      <circle cx="12" cy="-18" r="11" fill="#16a34a" stroke="#ffffff" stroke-width="1.5" />
      <polygon points="15,-18 22,-16 20,-12 14,-14" fill="#0f172a" /> <!-- Visor -->

      <!-- Siswa Penumpang (Seragam Putih Abu-abu & Tas) -->
      <g transform="translate(-14, 2)">
        <ellipse cx="0" cy="0" rx="8" ry="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <!-- Tas Ransel -->
        <polygon points="-12,-6 -6,-10 -6,10 -12,6" fill="#3b82f6" />
        <!-- Helm Hitam Siswa -->
        <circle cx="0" cy="-16" r="9" fill="#1e293b" stroke="#ffffff" stroke-width="1" />
      </g>

      <!-- Callout Badge -->
      <rect x="-30" y="-55" width="135" height="26" rx="8" fill="#15803d" stroke="#ffffff" stroke-width="1.5" filter="url(#glowGreen)" />
      <text x="37" y="-38" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">
        ✓ FOKUS RUTE JALAN
      </text>
    </g>

  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(80, 715)">
    <rect x="0" y="0" width="640" height="55" rx="16" fill="#1e293b" opacity="0.95" stroke="#f59e0b" stroke-width="1.5" />
    <text x="25" y="24" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">
      💡 Inti Abstraksi bagi Murid:
    </text>
    <text x="25" y="43" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">
      Peta ojol hanya menampilkan rute jalan dan titik jemput, mengabaikan pohon &amp; pagar agar cepat dipahami driver!
    </text>
  </g>
</svg>
