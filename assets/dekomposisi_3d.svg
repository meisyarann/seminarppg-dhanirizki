<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradients for Room & Furniture -->
    <linearGradient id="roomFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="wallLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="wallRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="bedSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="woodDesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="wardrobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="bgGradDekom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="shadow3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGradDekom)" rx="32" />

  <!-- Title Badge Top Left -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="370" height="60" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="2" opacity="0.95" />
    <text x="20" y="25" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="extrabold" letter-spacing="1.5">DEKOMPOSISI DALAM KEHIDUPAN MURID</text>
    <text x="20" y="47" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">Merapikan Kamar Tidur Siswa</text>
  </g>

  <!-- Isometric Room Base (Center ~ 400, 460) -->
  <g transform="translate(400, 460)" filter="url(#shadow3D)">
    
    <!-- Floor Tile (Isometric Rhombus) -->
    <path d="M 0 -180 L 320 0 L 0 180 L -320 0 Z" fill="#1e293b" stroke="#334155" stroke-width="3" />
    
    <!-- Left Wall -->
    <path d="M -320 0 L 0 -180 L 0 -360 L -320 -180 Z" fill="url(#wallLeft)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Right Wall -->
    <path d="M 0 -180 L 320 0 L 320 -180 L 0 -360 Z" fill="url(#wallRight)" stroke="#94a3b8" stroke-width="2" />

    <!-- Poster Sekolah di Dinding Kiri -->
    <g transform="translate(-180, -220)">
      <polygon points="0,0 60,-35 60,35 0,70" fill="#3b82f6" opacity="0.9" />
      <polygon points="10,12 50,-12 50,28 10,52" fill="#ffffff" />
      <text x="18" y="25" fill="#1e40af" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" transform="skewY(-30)">JADWAL</text>
      <text x="20" y="36" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" transform="skewY(-30)">KELAS X</text>
    </g>

    <!-- Jendela Kamar di Dinding Kanan -->
    <g transform="translate(100, -240)">
      <polygon points="0,0 80,45 80,-35 0,-80" fill="#38bdf8" opacity="0.75" stroke="#ffffff" stroke-width="3" />
      <!-- Window panes -->
      <line x1="40" y1="-37" x2="40" y2="22" stroke="#ffffff" stroke-width="2" />
      <line x1="0" y1="-40" x2="80" y2="5" stroke="#ffffff" stroke-width="2" />
      <!-- Sun rays -->
      <polygon points="0,-80 80,-35 150,-10 70,-55" fill="#fef08a" opacity="0.25" />
    </g>

    <!-- ============================================== -->
    <!-- BAGIAN 1 (DEKOMPOSISI): KASUR SISWA (KIRI)     -->
    <!-- ============================================== -->
    <g id="block-kasur" transform="translate(-170, -20)">
      <!-- Bed Frame -->
      <polygon points="-80,0 0,-45 100,10 20,55" fill="#0f172a" />
      <polygon points="-80,0 20,55 20,75 -80,20" fill="#334155" />
      <polygon points="20,55 100,10 100,30 20,75" fill="#475569" />
      <!-- Mattress & Bed Sheet -->
      <polygon points="-75,-5 0,-48 95,5 20,48" fill="url(#bedSheet)" />
      <!-- Pillow -->
      <polygon points="-55,-25 -20,-45 0,-35 -35,-15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="4" />
      <!-- Blanket Folded -->
      <polygon points="-25,12 20,-12 85,25 40,48" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
      
      <!-- Callout Badge 1 -->
      <g transform="translate(-40, -70)">
        <line x1="20" y1="50" x2="0" y2="10" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" />
        <rect x="-60" y="-15" width="120" height="28" rx="8" fill="#0891b2" stroke="#ffffff" stroke-width="1.5" filter="url(#badgeGlow)" />
        <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">1. RAPIKAN KASUR</text>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- BAGIAN 2 (DEKOMPOSISI): MEJA BELAJAR (TENGAH)  -->
    <!-- ============================================== -->
    <g id="block-meja" transform="translate(40, -100)">
      <!-- Table Top -->
      <polygon points="-50,-30 40,-80 120,-35 30,15" fill="url(#woodDesk)" />
      <!-- Table Thickness -->
      <polygon points="-50,-30 30,15 30,25 -50,-20" fill="#b45309" />
      <polygon points="30,15 120,-35 120,-25 30,25" fill="#78350f" />
      <!-- Table Legs -->
      <line x1="-45" y1="-20" x2="-45" y2="70" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
      <line x1="25" y1="25" x2="25" y2="115" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
      <line x1="115" y1="-25" x2="115" y2="65" stroke="#78350f" stroke-width="6" stroke-linecap="round" />

      <!-- Laptop on Table -->
      <polygon points="0,-25 35,-45 60,-30 25,-10" fill="#334155" />
      <polygon points="25,-10 60,-30 60,-65 25,-45" fill="#64748b" stroke="#38bdf8" stroke-width="1" />
      <text x="42" y="-35" fill="#38bdf8" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle">KOMPUTASI</text>

      <!-- Stack of Books (Buku Pelajaran Kelas X) -->
      <polygon points="-30,-15 -5,-30 15,-18 -10,-3" fill="#3b82f6" />
      <polygon points="-30,-10 -5,-25 15,-13 -10,2" fill="#ef4444" />
      <polygon points="-30,-5 -5,-20 15,-8 -10,7" fill="#10b981" />

      <!-- Callout Badge 2 -->
      <g transform="translate(60, -90)">
        <line x1="-10" y1="50" x2="10" y2="10" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" />
        <rect x="-55" y="-15" width="130" height="28" rx="8" fill="#d97706" stroke="#ffffff" stroke-width="1.5" filter="url(#badgeGlow)" />
        <text x="10" y="4" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">2. TATA MEJA BELAJAR</text>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- BAGIAN 3 (DEKOMPOSISI): LEMARI PAKAIAN (KANAN) -->
    <!-- ============================================== -->
    <g id="block-lemari" transform="translate(190, -40)">
      <!-- Wardrobe Top -->
      <polygon points="-35,-120 35,-160 85,-130 15,-90" fill="#a78bfa" />
      <!-- Wardrobe Left Side -->
      <polygon points="-35,-120 15,-90 15,30 -35,0" fill="url(#wardrobeGrad)" />
      <!-- Wardrobe Right Side -->
      <polygon points="15,-90 85,-130 85,-10 15,30" fill="#4c1d95" />
      <!-- Door Handles -->
      <circle cx="-5" cy="-25" r="2.5" fill="#fbbf24" />
      <circle cx="5" cy="-20" r="2.5" fill="#fbbf24" />

      <!-- Seragam SMA Tergantung di Luar -->
      <polygon points="-15,5 5,-5 20,5 0,25" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
      <polygon points="-5,12 5,12 8,25 -2,25" fill="#64748b" />

      <!-- Callout Badge 3 -->
      <g transform="translate(45, -170)">
        <line x1="0" y1="50" x2="0" y2="10" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3" />
        <rect x="-60" y="-15" width="125" height="28" rx="8" fill="#6d28d9" stroke="#ffffff" stroke-width="1.5" filter="url(#badgeGlow)" />
        <text x="2" y="4" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">3. GANTUNG SERAGAM</text>
      </g>
    </g>

    <!-- ============================================== -->
    <!-- BAGIAN 4 (DEKOMPOSISI): LANTAI KAMAR & SAPU    -->
    <!-- ============================================== -->
    <g id="block-lantai" transform="translate(0, 100)">
      <!-- Sapu Kamar -->
      <line x1="-30" y1="20" x2="40" y2="-35" stroke="#92400e" stroke-width="4" stroke-linecap="round" />
      <polygon points="-40,15 -25,10 -15,30 -35,35" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />

      <!-- Tas Ransel Sekolah di Lantai -->
      <polygon points="35,10 65,-5 80,10 50,25" fill="#3b82f6" />
      <polygon points="35,10 50,25 50,40 35,25" fill="#1d4ed8" />
      <polygon points="50,25 80,10 80,25 50,40" fill="#1e40af" />

      <!-- Callout Badge 4 -->
      <g transform="translate(0, 50)">
        <line x1="0" y1="-20" x2="0" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
        <rect x="-65" y="0" width="130" height="28" rx="8" fill="#059669" stroke="#ffffff" stroke-width="1.5" filter="url(#badgeGlow)" />
        <text x="0" y="18" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">4. SAPU BERSIH LANTAI</text>
      </g>
    </g>

  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(80, 715)">
    <rect x="0" y="0" width="640" height="55" rx="16" fill="#1e293b" opacity="0.95" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="24" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">
      💡 Inti Dekomposisi bagi Murid:
    </text>
    <text x="25" y="43" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">
      Masalah besar (kamar berantakan) tidak bikin stres jika diurai jadi 4 tugas kecil yang dikerjakan bergantian!
    </text>
  </g>
</svg>
